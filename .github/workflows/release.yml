name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test release validation
        run: python3 -B -m unittest discover -s Tests/Release -v
      - name: Verify version and release commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          app_version="$(cat VERSION)"
          [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid VERSION'; exit 1; }
          release_tag="v$app_version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$release_tag" || { echo 'Tag must match VERSION'; exit 1; }
          else
            test "$GITHUB_REF" = refs/heads/main || { echo 'Release must run from main or a version tag'; exit 1; }
          fi
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release commit must be on main'; exit 1; }
          release_commit="$(git rev-parse HEAD)"
          if git rev-parse --verify "refs/tags/$release_tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$release_tag^{commit}")" = "$release_commit" || { echo 'Version tag already points at another commit; bump VERSION'; exit 1; }
          fi
          published=false
          if release_json="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null)"; then
            python3 scripts/verify-release.py "$app_version" <<< "$release_json"
            published=true
            echo 'Release already exists; assets will not be overwritten.'
          fi
          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - name: Test and package
        if: steps.version.outputs.published != 'true'
        run: |
          zsh scripts/test.command
          python3 docs/site/build.py
          python3 docs/site/validate.py
          zsh scripts/release.command
          cd dist
          shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.published != 'true'
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    if: needs.package.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - name: Publish preview with matching version tag
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          cat > release-notes.md <<'NOTES'
          Universal preview for macOS 13 or later (Apple Silicon and Intel).

          Download the DMG, quit the existing app, and replace Blackout.app in the same folder. Password and language settings are kept separately. Check login startup and input-control permission after replacing the app.

          Hold Escape for three seconds for emergency exit, which deliberately bypasses the app password without deleting it. If the app is unresponsive, it quits; reopen it afterward. Forgot Password in Settings resets only the app password after macOS owner authentication.

          If the permission switch is already on but Blackout still asks for access, quit Blackout, remove its old permission entry, add and enable the currently installed app, then reopen it. An ad-hoc signature change can invalidate an old approval.

          This preview is ad-hoc signed and is not Apple-notarized. Automated checks cover password storage, input-routing decisions, translations, and packaging. Interactive input interception, IME behavior, login/reboot, and older macOS/Intel hardware still require real-device validation. See the repository's installation and distribution guides for current limits.
          NOTES
          # Creating a ref never updates an existing tag. Resolve annotated tags before publishing.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" >/dev/null \
            || echo 'Tag creation did not succeed; verifying the existing remote tag.'
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object | [.type, .sha] | @tsv')"
          read -r object_type object_sha <<< "$tag_object"
          while [ "$object_type" = tag ]; do
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object | [.type, .sha] | @tsv')"
            read -r object_type object_sha <<< "$tag_object"
          done
          if [ "$object_type" != commit ] || [ "$object_sha" != "$RELEASE_COMMIT" ]; then
            echo 'Remote version tag does not point at the packaged commit; refusing to publish.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/BlackoutMac-$APP_VERSION-universal.dmg" \
            "dist/BlackoutMac-$APP_VERSION-universal.zip" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --verify-tag \
            --title "BlackoutMac $APP_VERSION — Preview" --prerelease \
            --notes-file release-notes.md --generate-notes
